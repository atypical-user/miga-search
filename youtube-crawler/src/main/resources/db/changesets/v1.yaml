databaseChangeLog:
    - changeSet:
        id: 1
        author: atypical-user
        changes:
            - createTable:
                  tableName: yt_video_author
                  columns:
                      - column:
                            name: name
                            type: varchar(100)
                            constraints:
                                primaryKey: true
                                nullable: false
                      - column:
                            name: handle
                            type: varchar(100)
                            constraints:
                                unique: true
                                nullable: false
            - createTable:
                tableName: yt_video_meta_data
                columns:
                    - column:
                        name: id
                        type: varchar(50)
                        constraints:
                          primaryKey: true
                          unique: true
                          nullable: false
                    - column:
                        name: title
                        type: varchar(255)
                        constraints:
                          nullable: false
                    - column:
                        name: description
                        type: text
                        constraints:
                          nullable: true
                    - column:
                        name: author
                        type: varchar(50)
                        constraints:
                          nullable: false
                          foreignKeyName: fk_yt_video_meta_data_yt_video_author_handle
                          references: yt_video_author(handle)
                    - column:
                          name: duration
                          type: bigint
                          constraints:
                              nullable: false
                    - column:
                        name: upload_date
                        type: TIMESTAMP WITH TIME ZONE
                        constraints:
                          nullable: false
                    - column:
                        name: publish_date
                        type: TIMESTAMP WITH TIME ZONE
                        constraints:
                          nullable: false