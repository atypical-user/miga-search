# configure your datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/yt-meta-search

# Liquibase minimal config properties
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog.yaml

quarkus.rest-client.youtube-web-client.url=https://www.youtube.com

quarkus.log.category."io.miga".level=DEBUG